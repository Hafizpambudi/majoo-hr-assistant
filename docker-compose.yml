services:
  db:
    image: pgvector/pgvector:pg16
    container_name: majo-hr-pgvector
    environment:
      POSTGRES_USER: majo
      POSTGRES_PASSWORD: majo
      POSTGRES_DB: majo_hr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majo -d majo_hr"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
